name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download sherpa-onnx & model
        run: |
          chmod +x scripts/*.sh
          ./scripts/download-sherpa-onnx.sh
          ./scripts/download-model.sh
      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          # Явно указываем NDK, который требует скрипт сборки govorun-lite
          packages: 'platform-tools ndk;28.2.13676358'
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Olin-Golos-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
